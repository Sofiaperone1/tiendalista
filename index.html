<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tienda Lista</title>
    <meta
      name="description"
      content="Tienda Lista arma tiendas online para comercios. Catálogo, carrito y cobro, con los colores de tu marca."
    />
    <style>
      :root {
        color-scheme: dark;
        --navy: #120b2e;
        --pink: #ff4f9a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--navy);
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      main { text-align: center; padding: 32px 20px; }
      .mark {
        width: 112px;
        height: 112px;
        margin: 0 auto 28px;
        border-radius: 50%;
        background: conic-gradient(from 200deg, #ff8a00, #ff4f9a, #7a3cff, #ff8a00);
        display: grid;
        place-items: center;
      }
      .mark span {
        width: 86px;
        height: 86px;
        border-radius: 50%;
        background: var(--navy);
        display: grid;
        place-items: center;
        font-size: 34px;
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 52px);
        letter-spacing: 0.08em;
        font-weight: 800;
      }
      p {
        margin: 12px 0 0;
        color: var(--pink);
        letter-spacing: 0.16em;
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true"><span>✓</span></div>
      <h1>TIENDA LISTA</h1>
      <p>TU TIENDA EN 5 DÍAS</p>
    </main>
  </body>
</html>
